<script>
(function(){
  const mc = document.getElementById('mc');
  if(!mc) return;

  function mkEnt(l,t,w,name,hbg,bc,attrs,extra){
    const d = document.createElement('div');
    const isDashed = extra && extra.dashed;
    d.style.cssText = `position:absolute;left:${l}px;top:${t}px;width:${w}px;z-index:10;border-radius:7px;overflow:hidden;box-shadow:0 2px 18px rgba(0,0,0,0.7);`;

    let hContent = name;
    if(extra && extra.newBadge) hContent += `<span style="background:#22c55e;color:#052e16;font-size:7px;padding:1px 4px;border-radius:3px;margin-left:5px;font-weight:700;vertical-align:middle;">NEW</span>`;

    let rows = attrs.map(a=>{
      let dot = `<div style="width:6px;height:6px;flex-shrink:0;"></div>`;
      if(a.t==='PK') dot=`<div style="width:6px;height:6px;border-radius:50%;background:#60a5fa;flex-shrink:0;box-shadow:0 0 3px rgba(96,165,250,0.5);"></div>`;
      if(a.t==='FK') dot=`<div style="width:6px;height:6px;border-radius:50%;background:#f97316;flex-shrink:0;box-shadow:0 0 3px rgba(249,115,22,0.5);"></div>`;
      let corr = a.corrected?`<span style="background:#14532d;color:#86efac;font-size:7px;padding:0 3px;border-radius:2px;font-weight:700;flex-shrink:0;">✓FK</span>`:'';
      let opt = a.opt?`<span style="color:#334155;font-size:7.5px;flex-shrink:0;">(opt)</span>`:'';
      return `<div style="display:flex;align-items:center;gap:3px;">${dot}<span style="color:${a.t?'#e2e8f0':'#64748b'};flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${a.n}</span>${opt}${corr}<span style="color:#334155;font-size:8px;flex-shrink:0;">· ${a.d}</span></div>`;
    }).join('');

    let extras = '';
    if(extra && extra.qsBadge) extras+=`<div style="background:#92400e;color:#fef3c7;font-size:7.5px;font-weight:700;text-align:center;padding:3px;border-radius:4px;margin-top:3px;">⚡ QuickShare Overlay</div>`;
    if(extra && extra.statusNote) extras+=`<div style="text-align:right;color:#334155;font-size:7.5px;margin-top:2px;font-style:italic;">${extra.statusNote}</div>`;

    d.innerHTML=`
      <div style="background:${hbg};padding:5px 8px;font-size:10px;font-weight:700;color:#fff;text-align:center;letter-spacing:0.07em;">${hContent}</div>
      <div style="background:#07111f;border:1px ${isDashed?'dashed':'solid'} ${bc};border-top:none;padding:6px 7px 7px;display:flex;flex-direction:column;gap:2.5px;">${rows}${extras}</div>`;
    mc.appendChild(d);
  }

  // Col1: left=14, width=185, right=199
  mkEnt(14,80,185,'USUARIO','#1d4ed8','#1d4ed8',[
    {t:'PK',n:'id_usuario',d:'int'},

    {t:'',n:'ds_email',d:'string'},
    {t:'',n:'dt_cadastro',d:'date'},

    {t:'',n:'nr_preferencia_expiracao',d:'int'},
    {t:'',n:'ds_plano',d:'string'},

  // Col3 MIDIA: left=431, width=195, right=626

    {t:'',n:'ds_tipo',d:'string'},
    {t:'',n:'vl_tamanho_kb',d:'int'},
    {t:'',n:'dt_criacao',d:'datetime'},
    {t:'',n:'st_status',d:'string'},
    {t:'',n:'ds_resolucao',d:'string'},
    {t:'',n:'ds_versao',d:'string'},
    {t:'',n:'ds_origem',d:'string'},
  ]);

  // Col4 COMPARTILHAMENTO: left=648, width=210, right=858
  mkEnt(648,46,210,'COMPARTILHAMENTO','#be185d','#be185d',[
    {t:'PK',n:'id_comp',d:'int'},
    {t:'FK',n:'id_midia',d:'int',corrected:true},
    {t:'FK',n:'id_usuario',d:'int'},
    {t:'FK',n:'id_album',d:'int',opt:true},
    {t:'',n:'ds_plataforma',d:'string'},
    {t:'',n:'dt_data_hora',d:'datetime'},
    {t:'',n:'st_status',d:'string'},
    {t:'',n:'ds_tipo_conteudo',d:'string'},
  ],{qsBadge:true,dashed:true});

  // Col4 ALBUM: left=648, width=195
  mkEnt(648,259,195,'ALBUM','#065f46','#22c55e',[
    {t:'PK',n:'id_album',d:'int'},
    {t:'FK',n:'id_usuario',d:'int'},
    {t:'',n:'nm_nome',d:'string'},
    {t:'',n:'dt_criacao',d:'date'},
    {t:'',n:'tx_descricao',d:'string'},
  ],{newBadge:true,dashed:true});

  // Col5 GALERIA_DIARIA: left=875, width=195, right=1070

    {t:'PK',n:'id_galeria',d:'int'},
    {t:'FK',n:'id_usuario',d:'int'},
    {t:'',n:'dt_referencia',d:'date'},
    {t:'',n:'st_status',d:'string'},
    {t:'',n:'dt_expiracao',d:'datetime'},
    {t:'',n:'qt_total_itens',d:'int'},
  ],{statusNote:'ativa | expirada'});

  mkEnt(875,218,195,'GALERIA_ITEM','#b45309','#b45309',[
    {t:'PK',n:'id_item',d:'int'},
    {t:'FK',n:'id_galeria',d:'int'},
    {t:'FK',n:'id_midia',d:'int'},
    {t:'',n:'ds_acao_usuario',d:'string'},
    {t:'',n:'dt_decisao',d:'datetime'},
  ],{statusNote:'salvar | selecionar | expirar'});
})();
</script>

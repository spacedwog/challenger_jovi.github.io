name: Cleanup workflow runs

on:
  workflow_run:
    workflows:
      - Deploy GitHub Pages
    types:
      - completed
  workflow_dispatch:
    inputs:
      retain_runs:
        description: Quantidade de execuções concluídas preservadas por workflow
        required: false
        default: '10'
      max_age_days:
        description: Idade mínima em dias para excluir execuções concluídas
        required: false
        default: '7'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete old workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const inputs = context.payload.inputs ?? {};
            const retainRuns = Number(inputs.retain_runs ?? 10);
            const maxAgeDays = Number(inputs.max_age_days ?? 7);

            if (!Number.isInteger(retainRuns) || retainRuns < 0) {
              core.setFailed('retain_runs must be a non-negative integer.');
              return;
            }

            if (!Number.isInteger(maxAgeDays) || maxAgeDays < 0) {
              core.setFailed('max_age_days must be a non-negative integer.');
              return;
            }

            const cutoff = Date.now() - (maxAgeDays * 24 * 60 * 60 * 1000);
            const workflows = await github.paginate(github.rest.actions.listRepoWorkflows, {
              owner,
              repo,
              per_page: 100
            });

            let deletedRuns = 0;

            for (const workflow of workflows) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner,
                repo,
                workflow_id: workflow.id,
                status: 'completed',
                per_page: 100
              });

              const removableRuns = runs
                .filter((run) => run.id !== context.runId)
                .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at))
                .slice(retainRuns)
                .filter((run) => Date.parse(run.created_at) < cutoff);

              for (const run of removableRuns) {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });
                deletedRuns += 1;
                core.info(`Deleted workflow run ${run.id} from ${workflow.name}.`);
              }
            }

            await core.summary
              .addHeading('Workflow cleanup summary')
              .addRaw(`Deleted ${deletedRuns} completed workflow run(s).`)
              .write();
